# Publishes a GitHub Release with the APK whenever a new build is committed to apk/Switchboard.apk on main
# (or when run by hand). The version comes from versionName in app/build.gradle.kts; the tag (v1.26, ...) is created here.
# The APK is the signed build from the repo, so updates keep the same signature and install over older versions.
name: Release APK

on:
  push:
    branches: [main]
    paths: ["apk/Switchboard.apk"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          FILE="Switchboard-${TAG}.apk"
          cp apk/Switchboard.apk "$FILE"
          NOTES="Switchboard ${VERSION}. Download the APK below and open it on your Android phone (Android 8.0+); allow installing from your browser or files app when asked. It installs over earlier versions and keeps your chats and settings."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "Switchboard ${VERSION}" --notes "$NOTES" --latest
          fi
